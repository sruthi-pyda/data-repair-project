# Experimental cost configuration
#
# IMPORTANT: These costs are experimental assumptions defined by this project.
# They are NOT supplied by the REIN benchmark and do NOT represent real-world
# monetary values. They exist to test the cost-sensitive decision framework.
#
# Cost units are abstract "penalty units". Lower total cost = better policy.
#
# ─── ACTION COST EQUATIONS ───────────────────────────────────────────────────
#
#   E[ACCEPT_REPAIR]   = (1 - p) * c_wrong_repair
#   E[HUMAN_REVIEW]    = c_human_review             (constant)
#   E[LEAVE_UNCHANGED] = q * c_leave_error          (scales with q)
#
#   where p = calibrated probability that the proposed repair is correct
#         q = calibrated probability that the flagged cell is genuinely
#             corrupted (src/calibration/detection_calibrator.py, learned
#             per detection_method on a training split; q = 1 when the
#             detection calibrator cannot fit).
#
# ─── ANALYTICAL THRESHOLDS (the q = 1 case) ──────────────────────────────────
#
#   With q = 1 (every flagged cell assumed genuinely corrupted):
#
#   ACCEPT preferred over REVIEW when:
#       p > 1 - c_human_review / c_wrong_repair
#
#   ACCEPT preferred over LEAVE when:
#       p > 1 - c_leave_error / c_wrong_repair
#
#   With defaults (wrong=10, review=2, leave=5) and q = 1:
#       Accept over Review:  p > 1 - 2/10 = 0.80
#       Accept over Leave:   p > 1 - 5/10 = 0.50
#       → ACCEPT if p > 0.80, REVIEW if p ≤ 0.80 (since review(2) < leave(5))
#
#   For general q the LEAVE thresholds become
#       Accept over Leave:   p > 1 - q * c_leave_error / c_wrong_repair
#       Leave over Review:   q < c_human_review / c_leave_error
#
#   NOTE: REVIEW and LEAVE are both constant in p, but LEAVE scales with q.
#   At a fixed q whichever of the two is cheaper wins at every confidence;
#   because q varies per cell (near 1 for missing values, near 0 for IQR
#   false alarms) BOTH become reachable within one dataset. With the
#   shipped configs, LEAVE beats REVIEW exactly when
#       q < c_human_review / c_leave_error
#   i.e. q < 0.40 (adult), q < 0.50 (breast_cancer), q < 0.40 (smartfactory).
#   Under q = 1 every shipped config has c_leave_error > c_human_review, so
#   LEAVE/ABSTAIN is unreachable — that is the historical behaviour and it
#   is reproduced exactly whenever the detection calibrator is not fitted.

# ─── Default costs (used when no dataset-specific override exists) ────────────

defaults:
  c_wrong_repair: 10    # cost of automatically applying an incorrect repair
  c_human_review: 2     # cost of sending one cell to human review
  c_leave_error: 5      # cost of leaving a genuine error unrepaired

# ─── Per-dataset cost overrides ──────────────────────────────────────────────
# Rationale:
#   adult        - socioeconomic; BUT detected records are FPs (fnlwgt outliers)
#                  income label flips undetectable from dirty data alone
#   breast_cancer - medical domain; wrong repair has higher consequence
#                  (assumption, not a clinical fact)
#   smartfactory  - industrial sensor; wrong imputation can cause downstream errors

datasets:
  adult:
    c_wrong_repair: 10
    c_human_review: 2
    c_leave_error: 5
    note: >
      Adult detections are statistical false positives (fnlwgt IQR outliers).
      True corruption (income label flips) is undetectable from dirty data.
      Calibrated probabilities will be near 0 for all records.
      Abstention on Adult arises from the LEARNED corruption probability
      q ≈ 0 (every detection is an IQR false positive, so the detection
      calibrator learns q ≈ 0.01 for iqr_outlier), which makes
      E[LEAVE_UNCHANGED] = q * 5 ≈ 0.05 < c_human_review = 2. It is NOT a
      hand-set cost: c_leave_error = 5 is the original value (a genuine
      Adult error left in place would cost 5, the same as smartfactory).
      A temporary hand-set c_leave_error = 1 (2026-09-22) was reverted
      once q was learned — see docs/three_actions_plan.md.

  breast_cancer:
    c_wrong_repair: 50
    c_human_review: 5
    c_leave_error: 10
    note: >
      Medical data: wrong repair may affect downstream diagnosis or analysis.
      Higher wrong-repair cost reflects the domain sensitivity.
      ID columns (Unnamed: 0, Sample code number) excluded from repair decisions.

  smartfactory:
    c_wrong_repair: 25
    c_human_review: 2
    c_leave_error: 5
    note: >
      Industrial sensor data: incorrect imputation propagates into control systems.
      All detections are genuine missing values (no false positives from IQR).

# ─── Legacy tiers (kept for reference) ───────────────────────────────────────

cost_tiers:
  low:    { c_wrong_repair: 10 }
  medium: { c_wrong_repair: 25 }
  high:   { c_wrong_repair: 50 }
